name: Resolve Bilibili rl809868 opus IDs
on:
  push:
    branches:
      - tmp-resolve-rl809868

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve from readlist API dyn_id_str
        run: |
          python - <<'PY'
          import json, re, urllib.request, http.cookiejar
          from pathlib import Path

          api="https://api.bilibili.com/x/article/list/web/articles?id=809868"
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          headers={
            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36",
            "Referer":"https://www.bilibili.com/",
            "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.7"
          }
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with opener.open(req,timeout=30) as r:
              return r.geturl(),r.read().decode("utf-8","replace")
          try:
            get("https://www.bilibili.com/")
          except Exception:
            pass
          _,txt=get(api)
          data=json.loads(txt)
          arts=(data.get("data") or {}).get("articles") or []
          out={"rlid":809868,"api_code":data.get("code"),"articles":[]}
          for a in arts:
            dyn=str(a.get("dyn_id_str") or "").strip()
            item={
              "cvid":a.get("id"),
              "title":a.get("title"),
              "dyn_id_str":dyn,
              "opus_url":f"https://www.bilibili.com/opus/{dyn}" if dyn.isdigit() else None,
              "image_urls":a.get("image_urls") or [],
              "summary":a.get("summary") or "",
              "validation":None
            }
            if item["opus_url"]:
              try:
                final,html=get(item["opus_url"])
                m=re.search(r"<title[^>]*>(.*?)</title>",html,re.I|re.S)
                title_tag=re.sub(r"\s+"," ",m.group(1)).strip() if m else ""
                item["validation"]={
                  "final_url":final,
                  "title_tag":title_tag,
                  "html_len":len(html),
                  "title_matches":(a.get("title") or "") in title_tag
                }
              except Exception as e:
                item["validation"]={"error":repr(e)}
            out["articles"].append(item)
          Path("tmp").mkdir(exist_ok=True)
          Path("tmp/rl809868-opus.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/rl809868-opus.json
          git commit -m "Resolve rl809868 dyn IDs to opus" || exit 0
          git push
