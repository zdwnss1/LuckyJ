name: Test parser and frontend
on:
  push:
    branches: [main]
    paths: ['luckyj/**', 'tests/**', 'scripts/**', '.github/workflows/test.yml']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --check luckyj/static/app.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tests/fixtures.json.gz
          key: luckyj-real-fixtures-v1
      - name: Build checksum-pinned real sample database
        run: PYTHONPATH=. python3 tests/prepare_samples.py --data test-data
      - run: python3 -m pip install playwright==1.55.0
      - run: python3 -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python3 tests/browser_smoke.py --data test-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: |
            screenshots/
            tests/fixtures.json.gz
          retention-days: 90
