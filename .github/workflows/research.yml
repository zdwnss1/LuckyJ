name: Research engine and browser
on:
  pull_request:
  push:
    branches: [main, phase2-research-engine]
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Pure Python regression suite
        run: LUCKYJ_PURE_PYTHON=1 python -m unittest discover -s tests -v
      - name: Native differential and regression suite
        run: |
          python -m luckyj native
          python -m unittest discover -s tests -v
      - run: node --check luckyj/static/research.js && node --check luckyj/static/extensions.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m luckyj native
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Real HTTP browser test, offline synthetic fixtures
        run: PYTHONPATH=. python tests/browser_research.py
      - name: Calls, yaku and inference browser acceptance
        run: PYTHONPATH=. python tests/browser_calls_intent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-browser-verification
          path: |
            screenshots/research/
            screenshots/calls-intent/
          retention-days: 30
